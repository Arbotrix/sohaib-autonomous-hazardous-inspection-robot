amcl:
  ros__parameters:
    use_sim_time: True
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2

    base_frame_id: "base_link"
    odom_frame_id: "odom"
    global_frame_id: "map"

    laser_model_type: "likelihood_field"
    laser_max_range: 10.0
    laser_min_range: 0.12
    max_beams: 60

    min_particles: 500
    max_particles: 2000
    pf_err: 0.05
    pf_z: 0.99

    resample_interval: 1
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0

    scan_topic: "/scan"
    tf_broadcast: true
    transform_tolerance: 1.0

map_server:
  ros__parameters:
    use_sim_time: True
    yaml_filename: ""

planner_server:
  ros__parameters:
    use_sim_time: True
    expected_planner_frequency: 10.0
    planner_plugins: ["GridBased"]

    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: false

controller_server:
  ros__parameters:
    use_sim_time: True

    controller_frequency: 10.0

    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001

    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.1
      movement_time_allowance: 20.0

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25
      stateful: true

    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"

      min_vel_x: 0.0
      max_vel_x: 0.4

      min_vel_y: 0.0
      max_vel_y: 0.0

      min_vel_theta: -1.0
      max_vel_theta: 1.0

      acc_lim_x: 1.5
      acc_lim_y: 0.0
      acc_lim_theta: 2.0

      decel_lim_x: -1.5
      decel_lim_y: 0.0
      decel_lim_theta: -2.0

      vx_samples: 20
      vy_samples: 1
      vtheta_samples: 20

      sim_time: 1.7

      xy_goal_tolerance: 0.25
      trans_stopped_velocity: 0.1
      short_circuit_trajectory_evaluation: true
      stateful: true

      critics:
        - Oscillation
        - BaseObstacle
        - GoalAlign
        - PathAlign
        - PathDist
        - GoalDist

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: True

      update_frequency: 5.0
      publish_frequency: 2.0

      global_frame: "odom"
      robot_base_frame: "base_link"

      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05

      footprint: "[[0.40, 0.30], [0.40, -0.30], [-0.40, -0.30], [-0.40, 0.30]]"

      plugins: ["obstacle_layer", "inflation_layer"]

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan

        scan:
          topic: "/scan"
          data_type: "LaserScan"
          marking: true
          clearing: true
          obstacle_max_range: 10.0
          raytrace_max_range: 10.0
          max_obstacle_height: 2.0
          min_obstacle_height: 0.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.55

      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: True

      update_frequency: 1.0
      publish_frequency: 1.0

      global_frame: "map"
      robot_base_frame: "base_link"

      resolution: 0.05

      track_unknown_space: true

      footprint: "[[0.40, 0.30], [0.40, -0.30], [-0.40, -0.30], [-0.40, 0.30]]"

      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan

        scan:
          topic: "/scan"
          data_type: "LaserScan"
          marking: true
          clearing: true
          obstacle_max_range: 10.0
          raytrace_max_range: 10.0
          max_obstacle_height: 2.0
          min_obstacle_height: 0.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.55

      always_send_full_costmap: true

bt_navigator:
  ros__parameters:
    use_sim_time: True
    global_frame: "map"
    robot_base_frame: "base_link"
    odom_topic: "/odom"

    default_nav_to_pose_bt_xml: "/opt/ros/humble/share/nav2_bt_navigator/behavior_trees/navigate_to_pose_w_replanning_and_recovery.xml"

behavior_server:
  ros__parameters:
    use_sim_time: True

    global_frame: "map"
    robot_base_frame: "base_link"
    odom_topic: "/odom"

    cycle_frequency: 10.0

    behavior_plugins:
      - spin
      - backup
      - drive_on_heading
      - wait

    spin:
      plugin: "nav2_behaviors/Spin"

    backup:
      plugin: "nav2_behaviors/BackUp"

    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"

    wait:
      plugin: "nav2_behaviors/Wait"

waypoint_follower:
  ros__parameters:
    use_sim_time: True
    loop_rate: 20
    stop_on_failure: true
    waypoint_task_executor_plugin: "wait_at_waypoint"

    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 0

velocity_smoother:
  ros__parameters:
    use_sim_time: True
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"

    max_velocity: [0.4, 0.0, 1.0]
    min_velocity: [0.0, 0.0, -1.0]

    max_accel: [1.5, 0.0, 2.0]
    max_decel: [-1.5, 0.0, -2.0]

    odom_topic: "/odom"
    odom_duration: 0.1

    enable_stamped_cmd_vel: false
